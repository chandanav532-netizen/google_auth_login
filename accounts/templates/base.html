<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Django Google Auth{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px;
    margin: 40px auto; padding: 0 20px; }
    .btn { display: inline-block; padding: 12px 24px; background: #4285F4;
    color: white; text-decoration: none; border-radius: 6px;
    font-weight: 500; }
    .btn:hover { background: #3367D6; }
    .user-info { background: #f0f4f8; padding: 20px;
    border-radius: 8px; margin: 20px 0; }
   </style>
</head>
<body>
  <header>
  <h1>Django + Google OAuth2 Login</h1>
  <nav>
    {% if user.is_authenticated %}
    <a href="{% url 'account_logout' %}">Logout</a>
    {% else %}
    <a href="{% url 'account_login' %}">Login</a>
    {% endif %}
  </nav>
  </header>
 <main>
   {% if messages %}
   <ul>{% for message in messages %}<li>{{ message }}</li>{% endfor %}</ul>
   {% endif %}
   {% block content %}{% endblock %}
 </main>
</body>
</html>
